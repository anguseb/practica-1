<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <body>

        <!-- Fragmento 1: Header -->
        <header th:fragment="encabezado" class="suc-encabezado py-3">
            <div class="container d-flex align-items-center gap-3">
                <i class="fa-solid fa-seedling fa-2x" aria-hidden="true"></i>
                <div>
                    <h1 class="h3 mb-0" th:text="#{header.titulo}">Vivero de Suculentas</h1>
                    <p class="mb-0 small" th:text="#{header.eslogan}">Eslogan</p>
                </div>
            </div>
        </header>

        <!-- Fragmento 2: Navbar -->
        <nav th:fragment="menu" class="navbar navbar-expand-md navbar-dark suc-navbar py-0">
            <div class="container">
                <button class="navbar-toggler my-2" type="button" data-bs-toggle="collapse"
                        data-bs-target="#menuPrincipal" aria-controls="menuPrincipal"
                        aria-expanded="false" th:aria-label="#{navbar.menu}">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="menuPrincipal">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/}"
                               th:classappend="${paginaActiva == 'inicio'} ? 'active'">
                                <i class="fa-solid fa-house me-1" aria-hidden="true"></i>
                                <span th:text="#{navbar.inicio}">Inicio</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/suculentas}"
                               th:classappend="${paginaActiva == 'suculentas'} ? 'active'">
                                <i class="fa-solid fa-leaf me-1" aria-hidden="true"></i>
                                <span th:text="#{navbar.suculentas}">Suculentas</span>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <!-- Fragmento 3: Footer -->
        <footer th:fragment="pie" class="suc-pie mt-auto py-3 text-center">
            <div class="container">
                <p class="mb-1" th:text="#{footer.derechos}">Derechos reservados</p>
                <small th:text="#{footer.contacto}">Contacto</small>
            </div>
        </footer>

    </body>
</html>
