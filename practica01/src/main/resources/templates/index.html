<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{general/plantilla :: estructura(~{::title}, ~{::main})}">
    <head>
        <title th:text="#{header.titulo}">Vivero de Suculentas</title>
    </head>
    <body>
        <main class="flex-grow-1 container py-4">

            <section class="p-4 p-md-5 mb-4 rounded-3 suc-portada">
                <h2 class="display-6 fw-semibold" th:text="#{inicio.bienvenida}">Bienvenido</h2>
                <p class="fs-5 mb-4" th:text="#{inicio.presentacion}">Presentación</p>
                <a class="btn btn-suc btn-lg" th:href="@{/suculentas}">
                    <i class="fa-solid fa-leaf me-1" aria-hidden="true"></i>
                    <span th:text="#{inicio.boton}">Ver catálogo</span>
                </a>
            </section>

            <div class="row g-4">
                <div class="col-md-4">
                    <div class="card card-suc h-100">
                        <div class="card-body">
                            <i class="fa-solid fa-droplet fa-lg suc-icono mb-2" aria-hidden="true"></i>
                            <h3 class="h5 card-title" th:text="#{inicio.riego.titulo}">Riego</h3>
                            <p class="card-text" th:text="#{inicio.riego.texto}">Texto</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card card-suc h-100">
                        <div class="card-body">
                            <i class="fa-solid fa-sun fa-lg suc-icono mb-2" aria-hidden="true"></i>
                            <h3 class="h5 card-title" th:text="#{inicio.luz.titulo}">Luz</h3>
                            <p class="card-text" th:text="#{inicio.luz.texto}">Texto</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card card-suc h-100">
                        <div class="card-body">
                            <i class="fa-solid fa-mountain fa-lg suc-icono mb-2" aria-hidden="true"></i>
                            <h3 class="h5 card-title" th:text="#{inicio.sustrato.titulo}">Sustrato</h3>
                            <p class="card-text" th:text="#{inicio.sustrato.texto}">Texto</p>
                        </div>
                    </div>
                </div>
            </div>

        </main>
    </body>
</html>
